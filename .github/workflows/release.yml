name: Release Helm Chart

on:
  push:
    branches:
      - master
    paths:
      - 'chart/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Lint chart
        run: helm lint chart/

      - name: Package chart
        run: helm package chart/ -d docs/

      - name: Update repo index
        run: |
          helm repo index docs/ --url https://morooshka.github.io/token-loom

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          VERSION=$( helm show chart chart/ | grep -oP '(?<=^version: ).+' )
          git add docs/
          git diff --staged --quiet || git commit -m "Release v${VERSION} [skip ci]"
          git push
